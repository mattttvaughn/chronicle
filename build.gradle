// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        kotlinVersion = '1.9.24'
        coroutinesVersion = "1.6.4"
        archLifecycleVersion = "1.1.1"
        gradleVersion = '8.7.3'
        supportlibVersion = '1.7.0'
        materialLibVersion = '1.9.0'
        retrofitVersion = "2.9.0"
        moshiKotlinVersion = '1.15.2'
        okhttpVersion = '4.10.0'
        dataBindingCompilerVersion = gradleVersion // Always need to be the same
        roomVersion = "2.5.2"
        frescoVersion = "2.4.0"
        exoplayerVersion = "2.19.1"
        exoplayerExtensions = "master-SNAPSHOT" // YOLO
        workVersion = '2.9.1'
        junitVersion = '4.13.2'
        androidxTestRunnerVersion = '1.6.1' // TODO: this needs to be split up, because there's newer versions of the rules
        espressoVersion = '3.6.1'
        androidxAnnotationVersion = "1.6.0"
        lifecycleVersion = "2.8.7"
        ossLicenseActivityVersion = "17.1.0"
        androidXTestExtKotlinRunnerVersion = '1.2.1'
        androidXTestCoreVersion = '1.6.1'
        robolectricVersion = '4.4'
        archTestingVersion = "2.2.0"
        hamcrestVersion = "1.3"
        mockKVersion = "1.10.0"
        daggerVersion = '2.45'
        localBroadcastManagerVersion = "1.1.0"
        androidXCustomTabsVersion = "1.8.0"
        swipeRefreshLayoutVersion = "1.1.0"
        iapWrapperVersion = '1.7.0'
        constraintLayoutVersion = '2.2.0'
        kotlinResultVersion = '1.1.11'
        timberVersion = "4.7.1"
        seismicVersion = "1.0.3"
        appCompatFragmentVersion = "1.8.5"
    }
    repositories {
        google()
        jcenter()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
        maven { url "https://jitpack.io" }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$gradleVersion"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath 'com.google.android.gms:oss-licenses-plugin:0.10.6'
        classpath "org.jlleitschuh.gradle:ktlint-gradle:12.1.2"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    apply plugin: "org.jlleitschuh.gradle.ktlint"
    repositories {
        google()
        jcenter()
        maven { url "https://jitpack.io" }
    }
    ktlint {
        debug.set(true)
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Allow experimental kotlin features, like coroutines
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
    kotlinOptions.freeCompilerArgs += ["-Xuse-experimental=io.ktor.locations.KtorExperimentalLocationsAPI"]
    kotlinOptions.freeCompilerArgs += ["-Xallow-result-return-type"]
    kotlinOptions.freeCompilerArgs += ["-Xopt-in=kotlin.RequiresOptIn"]
    kotlinOptions.freeCompilerArgs += ["-Xopt-in=kotlin.time.ExperimentalTime"]
    kotlinOptions.freeCompilerArgs += ["-Xopt-in=kotlinx.coroutines.InternalCoroutinesApi"]
}

task installGitHook(type: Copy) {
    from new File(rootProject.rootDir, 'pre-commit')
    into { new File(rootProject.rootDir, '.git/hooks') }
    fileMode 0777
}
tasks.getByPath(':app:preBuild').dependsOn installGitHook


